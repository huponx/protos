syntax = "proto3";

package identity.v1;

import "authz/v1/options.proto";

option go_package = "github.com/huponx/protogen/identity/v1;identityv1";

// IdentityService is the internal administration API of identity. The OAuth 2.0 and OpenID
// Connect endpoints (authorize, token, revoke, userinfo, JWKS) are HTTP and are not part of
// this contract. Every method needs a permission, see the comment of the method.
service IdentityService {
  // Introspect reports whether an access token is active (RFC 7662). Permission: identity:token:read.
  rpc Introspect(IntrospectRequest) returns (IntrospectResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:token:read"]
    };
  }
  // CheckPermission reports whether a user holds a permission. Permission: identity:permission:read.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:permission:read"]
    };
  }
  // RevokeToken revokes an access token by jti. Permission: identity:token:write.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:token:write"]
    };
  }

  // Users. Permission: identity:user:read for Get and List, identity:user:write for the others.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:read"]
    };
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (authz.v1.rule) = {
      any_of: [
        "identity:user:read",
        "identity:user:approve"
      ]
    };
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  rpc SetUserDisabled(SetUserDisabledRequest) returns (SetUserDisabledResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  // ListUserSessions lists the SSO sessions (devices) of a user; `current` is always false. RevokeUserSessions ends all of
  // them, revokes the refresh tokens and the access tokens issued so far (like disabling the user, without disabling).
  rpc ListUserSessions(ListUserSessionsRequest) returns (ListUserSessionsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:read"]
    };
  }
  rpc RevokeUserSessions(RevokeUserSessionsRequest) returns (RevokeUserSessionsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  // DeleteUser deletes the account (soft: see DeleteUserRequest).
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  rpc SetUserPassword(SetUserPasswordRequest) returns (SetUserPasswordResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  rpc SendPasswordReset(SendPasswordResetRequest) returns (SendPasswordResetResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  // UpdateUser changes the name and the locale. SetUserAvatar stores (or clears) the picture.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  rpc SetUserAvatar(SetUserAvatarRequest) returns (SetUserAvatarResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  // SendWelcome (re)sends the welcome mail with a link to set the first password. Only for a
  // user who has no password yet (status PENDING).
  rpc SendWelcome(SendWelcomeRequest) returns (SendWelcomeResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:write"]
    };
  }
  // ApproveUser accepts a self-registered user (status PENDING_APPROVAL): the welcome mail with the link to set the
  // password goes out. RejectUser deletes the user and tells them by mail (the address may register again).
  // Permission: identity:user:approve.
  rpc ApproveUser(ApproveUserRequest) returns (ApproveUserResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:approve"]
    };
  }
  rpc RejectUser(RejectUserRequest) returns (RejectUserResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:approve"]
    };
  }

  // Counts of users by status, MFA and activity.
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:user:read"]
    };
  }

  // The signed-in user's own profile. Any user with a user token may call them (no permission):
  // the user is the subject of the token, never a field of the request, so nobody can reach
  // another user through them. Service tokens are refused.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // UpdateMe changes the own name and locale; an empty field keeps the current value.
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc SetMyAvatar(SetMyAvatarRequest) returns (SetMyAvatarResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // ChangeMyPassword checks the current password and sets a new one (the password policy applies). Like SetUserPassword it
  // ends every session and token of the user, the caller's too: the user signs in again.
  rpc ChangeMyPassword(ChangeMyPasswordRequest) returns (ChangeMyPasswordResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // The own multi-factor authentication (the same steps as the account page of the sign in app). GetMyMFA only says whether it is on.
  rpc GetMyMFA(GetMyMFARequest) returns (GetMyMFAResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // BeginMyMFA starts the setup: it returns the QR code and the key of the pending enrollment (created on the first call,
  // the same ones after). Refused when MFA is already on.
  rpc BeginMyMFA(BeginMyMFARequest) returns (BeginMyMFAResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // ConfirmMyMFA checks the first code of the authenticator app, turns MFA on and returns the recovery codes (shown once).
  rpc ConfirmMyMFA(ConfirmMyMFARequest) returns (ConfirmMyMFAResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // DisableMyMFA turns MFA off after the password and a code (or a recovery code); refused when MFA is required for the user.
  rpc DisableMyMFA(DisableMyMFARequest) returns (DisableMyMFAResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // RegenerateMyRecoveryCodes replaces the recovery codes (the old ones stop working) after the password and a code of the
  // authenticator app (a recovery code is not accepted: it would spend the code it is about to replace). Returns the new
  // codes, shown once. Refused when MFA is off.
  rpc RegenerateMyRecoveryCodes(RegenerateMyRecoveryCodesRequest) returns (RegenerateMyRecoveryCodesResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // The own passkeys (WebAuthn credentials), a way to sign in next to the password. The browser runs the ceremony: Begin
  // returns the options for navigator.credentials.create (as the JSON of the web API) and Finish takes the answer back, so
  // the same steps as the account page of the sign in app. Adding and deleting need the current password. They answer
  // NOT_FOUND "passkeys_off" when the server has passkeys turned off.
  rpc ListMyPasskeys(ListMyPasskeysRequest) returns (ListMyPasskeysResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc BeginMyPasskey(BeginMyPasskeyRequest) returns (BeginMyPasskeyResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc FinishMyPasskey(FinishMyPasskeyRequest) returns (FinishMyPasskeyResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc RenameMyPasskey(RenameMyPasskeyRequest) returns (RenameMyPasskeyResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc DeleteMyPasskey(DeleteMyPasskeyRequest) returns (DeleteMyPasskeyResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // The own SSO sessions, one per sign in on a browser or device. ListMySessions marks the one of the caller (the sid of
  // its token) as current. RevokeMySession ends one (NOT_FOUND "session_not_found" for an unknown id or one of another
  // user); revoking the current one signs the caller out. RevokeMyOtherSessions keeps the current one. Ending a session
  // revokes its refresh tokens and signs out the applications that used it (back-channel logout); access tokens already
  // issued live until they expire (IDENTITY_ACCESS_TOKEN_TTL) where a service verifies them locally.
  rpc ListMySessions(ListMySessionsRequest) returns (ListMySessionsResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc RevokeMySession(RevokeMySessionRequest) returns (RevokeMySessionResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc RevokeMyOtherSessions(RevokeMyOtherSessionsRequest) returns (RevokeMyOtherSessionsResponse) {
    option (authz.v1.rule) = {public: true};
  }
  // The settings the signed-in user keeps for one application ("dictionary"): a JSON object that
  // identity stores without looking inside; the application validates what it writes. Same rules as
  // the other "me" methods (user token, no permission). Called by the application on behalf of the
  // user (token exchange), not by the browser.
  rpc GetMyUserSettings(GetMyUserSettingsRequest) returns (GetMyUserSettingsResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc PutMyUserSettings(PutMyUserSettingsRequest) returns (PutMyUserSettingsResponse) {
    option (authz.v1.rule) = {public: true};
  }

  // Roles. Permission: identity:role:read for List, identity:role:write for the others.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:role:write"]
    };
  }
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (SetRolePermissionsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:role:write"]
    };
  }
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:role:read"]
    };
  }
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:role:write"]
    };
  }
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:role:write"]
    };
  }
  // The catalog of permissions roles can be given, read only: services define them in their permissions.proto and
  // register them at start. The wildcards that cover them are listed too (generated, not stored).
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:permission:read"]
    };
  }
  // RegisterPermissions is called by a service at start with everything it declares in its permissions.proto:
  // identity inserts, updates, renames and retires the permissions of that service in one transaction. A service
  // may only name permissions of its own namespace ("dictionary:*" from the dictionary).
  rpc RegisterPermissions(RegisterPermissionsRequest) returns (RegisterPermissionsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:permission:register"]
    };
  }
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:role:write"]
    };
  }
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:role:write"]
    };
  }

  // Clients. Permission: identity:client:read for List, identity:client:write for the others.
  rpc CreateClient(CreateClientRequest) returns (CreateClientResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:client:write"]
    };
  }
  rpc UpdateClient(UpdateClientRequest) returns (UpdateClientResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:client:write"]
    };
  }
  rpc SetClientDisabled(SetClientDisabledRequest) returns (SetClientDisabledResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:client:write"]
    };
  }
  rpc DeleteClient(DeleteClientRequest) returns (DeleteClientResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:client:write"]
    };
  }
  rpc RotateClientSecret(RotateClientSecretRequest) returns (RotateClientSecretResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:client:write"]
    };
  }
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:client:read"]
    };
  }

  // Token exchange policies (deny by default). Permission: identity:exchange:read for List,
  // identity:exchange:write for Set.
  rpc SetExchangePolicy(SetExchangePolicyRequest) returns (SetExchangePolicyResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:exchange:write"]
    };
  }
  rpc ListExchangePolicies(ListExchangePoliciesRequest) returns (ListExchangePoliciesResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:exchange:read"]
    };
  }

  // Multi-factor authentication. Permission: identity:mfa:read for Get, identity:mfa:write for the others.
  rpc GetUserMFA(GetUserMFARequest) returns (GetUserMFAResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:mfa:read"]
    };
  }
  rpc SetUserMFA(SetUserMFARequest) returns (SetUserMFAResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:mfa:write"]
    };
  }
  rpc EnforceUserMFA(EnforceUserMFARequest) returns (EnforceUserMFAResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:mfa:write"]
    };
  }
  rpc ResetUserMFA(ResetUserMFARequest) returns (ResetUserMFAResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:mfa:write"]
    };
  }

  // The look of the web apps (admin, dictionary, sign in), one value for the whole system.
  // GetUIStyle: any signed-in user (no permission); the sign in pages read it through the public
  // /auth-api/ui-style instead. SetUIStyle. Permission: identity:settings:write.
  rpc GetUIStyle(GetUIStyleRequest) returns (GetUIStyleResponse) {
    option (authz.v1.rule) = {public: true};
  }
  rpc SetUIStyle(SetUIStyleRequest) returns (SetUIStyleResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:settings:write"]
    };
  }

  // Self-registration settings. GetRegistrationSettings: identity:settings:read. SetRegistrationSettings:
  // identity:settings:write.
  rpc GetRegistrationSettings(GetRegistrationSettingsRequest) returns (GetRegistrationSettingsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:settings:read"]
    };
  }
  rpc SetRegistrationSettings(SetRegistrationSettingsRequest) returns (SetRegistrationSettingsResponse) {
    option (authz.v1.rule) = {
      any_of: ["identity:settings:write"]
    };
  }
}

// ---- tokens ----

message IntrospectRequest {
  string token = 10;
}

message IntrospectResponse {
  bool active = 10;
  string sub = 20;
  string client_id = 30;
  string scope = 40;
  repeated string aud = 50;
  string jti = 60;
  int64 exp = 70;
  // Actor chain of an exchanged token, most recent first.
  repeated string act = 80;
}

message CheckPermissionRequest {
  string user_id = 10;
  string permission = 20;
}

message CheckPermissionResponse {
  bool allowed = 10;
}

message RevokeTokenRequest {
  string jti = 10;
  // Seconds the denylist entry must live: the remaining life of the token.
  int64 ttl_seconds = 20;
}

message RevokeTokenResponse {}

// ---- users ----

// UserStatus is derived: DISABLED when the account is disabled, PENDING_APPROVAL while a self-registered
// user waits for an administrator, PENDING until the user has set a password (a new user must do it
// through the welcome mail), ACTIVE otherwise.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING = 10;
  USER_STATUS_ACTIVE = 20;
  USER_STATUS_DISABLED = 30;
  USER_STATUS_PENDING_APPROVAL = 40;
}

message User {
  string id = 10;
  string email = 20;
  string name = 30;
  string locale = 40;
  bool disabled = 50;
  repeated string roles = 60;
  bool mfa_enabled = 70;
  bool mfa_enforced = 80;
  int64 created_at = 90;
  UserStatus status = 100;
  // light, dark or system; empty until the user chose one.
  string theme = 140;
  bool has_avatar = 110;
  // The picture as a data URI ("data:image/webp;base64,..."). Only GetUser fills it, lists do not.
  string avatar = 120;
  // Unix seconds of the last completed sign in; 0 when the user never signed in (or did before this was tracked).
  int64 last_login_at = 130;
}

message GetUserStatsRequest {}

// Counts over all users.
message GetUserStatsResponse {
  int64 total = 10;
  int64 active = 20;
  // Created, the password is not set yet.
  int64 pending = 30;
  int64 disabled = 40;
  int64 mfa_enabled = 50;
  int64 mfa_enforced = 60;
  int64 with_avatar = 70;
  // Signed in during the last 30 days.
  int64 signed_in_30d = 80;
  // Never signed in (or only before sign ins were tracked).
  int64 never_signed_in = 90;
  // Created since the start of this month (UTC).
  int64 created_this_month = 100;
  // Self-registered, waiting for an administrator.
  int64 awaiting_approval = 110;
}

message GetUserRequest {
  // One of id, user_id (same as id, the name of the path parameter of the gateway) and email.
  string id = 10;
  string email = 20;
  string user_id = 30;
}

message GetUserResponse {
  User user = 10;
}

message ListUsersRequest {
  // Users whose email starts with this text (case insensitive). Empty lists everyone.
  string query = 10;
  // Default 50, at most 200.
  int32 page_size = 20;
  // The next_page_token of the previous page. Users are ordered by email.
  string page_token = 30;
  // Users whose name contains this text (case insensitive).
  string name = 40;
  // Only users with this status; UNSPECIFIED means any.
  UserStatus status = 50;
  // Only users who have this role.
  string role = 60;
}

message ListUsersResponse {
  repeated User users = 10;
  // Empty on the last page.
  string next_page_token = 20;
}

message CreateUserRequest {
  string email = 10;
  string name = 20;
  string locale = 30;
  // Empty: the user sets the password through the password reset flow.
  string password = 40;
  repeated string roles = 50;
  // Send the welcome mail with the link to set the password (only when password is empty).
  bool send_welcome = 60;
}

message CreateUserResponse {
  User user = 10;
}

message SetUserDisabledRequest {
  string user_id = 10;
  bool disabled = 20;
}

message SetUserDisabledResponse {}

// The account is disabled, loses its sessions, tokens, roles, MFA and settings, and its email and name are
// anonymized (the email can be registered again) at once; the data of the services (dictionary words, files) is
// deleted in the background and the row after a grace period. Idempotent: deleting a deleted user succeeds.
// FAILED_PRECONDITION for the user of the calling token and for the last user holding the admin role. There is no undo.
message DeleteUserRequest {
  string user_id = 10;
}

message DeleteUserResponse {}

message SetUserPasswordRequest {
  string user_id = 10;
  string password = 20;
}

message SetUserPasswordResponse {}

message SendPasswordResetRequest {
  string user_id = 10;
}

message SendPasswordResetResponse {}

message UpdateUserRequest {
  string user_id = 10;
  string name = 20;
  // Empty keeps the current locale.
  string locale = 30;
}

message UpdateUserResponse {
  User user = 10;
}

message SetUserAvatarRequest {
  string user_id = 10;
  // The encoded image (png, jpeg or webp, at most 64 KiB, at most 512x512). Empty removes the picture.
  bytes image = 20;
  string mime_type = 30;
}

message SetUserAvatarResponse {}

message SendWelcomeRequest {
  string user_id = 10;
}

message SendWelcomeResponse {}

message ApproveUserRequest {
  string user_id = 10;
}

message ApproveUserResponse {}

message RejectUserRequest {
  string user_id = 10;
}

message RejectUserResponse {}

message GetMeRequest {}

// GetMeResponse carries the picture as a data URI, like GetUser.
message GetMeResponse {
  User user = 10;
}

message UpdateMeRequest {
  string name = 10;
  string locale = 20;
  // light, dark or system; empty keeps the current value.
  string theme = 30;
}

message UpdateMeResponse {
  User user = 10;
}

message SetMyAvatarRequest {
  // As SetUserAvatarRequest: empty removes the picture.
  bytes image = 10;
  string mime_type = 20;
}

message SetMyAvatarResponse {}

message ChangeMyPasswordRequest {
  string current_password = 10;
  string new_password = 20;
}

message ChangeMyPasswordResponse {}

message GetMyMFARequest {}

message GetMyMFAResponse {
  bool enabled = 10;
  // MFA is required for the account: it cannot be turned off.
  bool forced = 20;
  int32 recovery_codes_left = 30;
}

message BeginMyMFARequest {}

message BeginMyMFAResponse {
  // A data URL of the QR code and the key to type.
  string qr = 10;
  string secret = 20;
}

message ConfirmMyMFARequest {
  string code = 10;
}

message ConfirmMyMFAResponse {
  repeated string recovery_codes = 10;
}

message DisableMyMFARequest {
  string password = 10;
  // A code of the authenticator app or a recovery code.
  string code = 20;
}

message DisableMyMFAResponse {}

message RegenerateMyRecoveryCodesRequest {
  string password = 10;
  // A code of the authenticator app.
  string code = 20;
}

message RegenerateMyRecoveryCodesResponse {
  repeated string recovery_codes = 10;
}

message Passkey {
  string id = 10;
  string name = 20;
  int64 created_at = 30;
  // Unix seconds of the last sign in with it; 0 when never used.
  int64 last_used_at = 40;
  // The passkey is synced between the devices of its owner (backup eligible), not bound to one.
  bool synced = 50;
}

message ListMyPasskeysRequest {}

message ListMyPasskeysResponse {
  repeated Passkey passkeys = 10;
  // How many passkeys a user may have.
  int32 max = 20;
}

message BeginMyPasskeyRequest {
  // The current password.
  string password = 10;
}

message BeginMyPasskeyResponse {
  // Comes back in FinishMyPasskey; valid for 5 minutes, once.
  string ceremony_id = 10;
  // The JSON for navigator.credentials.create (PublicKeyCredentialCreationOptionsJSON).
  string options_json = 20;
}

message FinishMyPasskeyRequest {
  string ceremony_id = 10;
  // The JSON of the credential the browser returned (RegistrationResponseJSON).
  string credential_json = 20;
  // 1 to 60 characters.
  string name = 30;
}

message FinishMyPasskeyResponse {
  Passkey passkey = 10;
}

message RenameMyPasskeyRequest {
  string id = 10;
  string name = 20;
}

message RenameMyPasskeyResponse {}

message DeleteMyPasskeyRequest {
  string id = 10;
  // The current password.
  string password = 20;
}

message DeleteMyPasskeyResponse {}

// An SSO session: one sign in on one browser or device. The browser, os and device are read from the User-Agent when
// listed; all are empty for a session that was created before they were recorded.
message Session {
  // The public id of the session (the sid of its tokens).
  string id = 10;
  string ip = 20;
  string browser = 30;
  // The major version of the browser.
  string browser_version = 35;
  string os = 40;
  // desktop, mobile, tablet or unknown.
  string device = 50;
  // How the user signed in: pwd, otp, swk, hwk, mfa.
  repeated string amr = 60;
  // Unix seconds.
  int64 created_at = 70;
  // Unix seconds of the last activity (at most a minute behind); 0 when unknown.
  int64 last_seen_at = 80;
  // The session of the caller.
  bool current = 90;
}

message ListMySessionsRequest {}

message ListMySessionsResponse {
  // Newest first.
  repeated Session sessions = 10;
}

message RevokeMySessionRequest {
  string id = 10;
}

message RevokeMySessionResponse {}

message RevokeMyOtherSessionsRequest {}

message RevokeMyOtherSessionsResponse {
  int32 revoked = 10;
}

message ListUserSessionsRequest {
  string user_id = 10;
}

message ListUserSessionsResponse {
  repeated Session sessions = 10;
}

message RevokeUserSessionsRequest {
  string user_id = 10;
}

message RevokeUserSessionsResponse {
  int32 revoked = 10;
}

message GetMyUserSettingsRequest {
  // Short lowercase name of the application: a letter, then letters, digits, "_" or "-" (32 at most).
  string app = 10;
}

message GetMyUserSettingsResponse {
  // A JSON object; "{}" when the user has stored nothing for the application.
  string settings_json = 10;
}

message PutMyUserSettingsRequest {
  string app = 10;
  // A JSON object of at most 16 KiB; it replaces what was stored.
  string settings_json = 20;
}

message PutMyUserSettingsResponse {}

// ---- roles ----

message Role {
  string name = 10;
  string description = 20;
  // Permissions are colon separated segments ("identity:user:read"); "*" is a wildcard (alone: everything, trailing: one or more segments, elsewhere: one segment).
  repeated string permissions = 30;
  // How many users and clients hold the role (filled by ListRoles and the role responses); a role that is held cannot be deleted.
  int64 assigned_count = 40;
  // The permissions of `permissions` that no longer exist in the code (retired permissions and wildcards that
  // cover nothing); they do nothing and may be removed.
  repeated string retired_permissions = 50;
}

message CreateRoleRequest {
  Role role = 10;
}

message CreateRoleResponse {
  Role role = 10;
}

message SetRolePermissionsRequest {
  string role = 10;
  repeated string permissions = 20;
}

message SetRolePermissionsResponse {
  Role role = 10;
}

// Replaces the description and the permissions of a role.
message UpdateRoleRequest {
  string role = 10;
  string description = 20;
  repeated string permissions = 30;
}

message UpdateRoleResponse {
  Role role = 10;
}

// Fails with FAILED_PRECONDITION while a user or a client holds the role.
message DeleteRoleRequest {
  string role = 10;
}

message DeleteRoleResponse {}

message ListRolesRequest {
  // Roles whose name or description contains this text, or that hold a permission containing it (case
  // insensitive). Empty lists every role.
  string query = 10;
  // Default 50, at most 200.
  int32 page_size = 20;
  // The next_page_token of the previous page. Roles are ordered by name.
  string page_token = 30;
}

message ListRolesResponse {
  repeated Role roles = 10;
  // Empty on the last page.
  string next_page_token = 20;
  // How many roles match the query (all pages).
  int64 total = 30;
}

// ---- permission catalog ----

message Permission {
  // Colon separated segments ("identity:user:read"); "*" is a wildcard (see Role.permissions).
  string name = 10;
  string description = 20;
  // How many roles hold it.
  int64 role_count = 30;
  // The service that defines it ("identity"); empty for a wildcard.
  string service = 40;
  // A generated wildcard ("identity:*:read"): not stored, listed so roles can be given it.
  bool wildcard = 50;
  // Removed from the code of its service but still held by a role: not enforced, not in tokens, hidden from the picker.
  bool retired = 60;
}

message ListPermissionsRequest {
  // Permissions whose name or description contains this text (case insensitive). Empty lists every one.
  string query = 10;
  // Default 50, at most 200.
  int32 page_size = 20;
  // The next_page_token of the previous page. Permissions are ordered by name.
  string page_token = 30;
}

message ListPermissionsResponse {
  repeated Permission permissions = 10;
  // Empty on the last page.
  string next_page_token = 20;
  // How many permissions match the query (all pages).
  int64 total = 30;
}

// A permission a service declared, sent by RegisterPermissions.
message PermissionDeclaration {
  string name = 10;
  string description = 20;
  // The previous name: its role grants move to `name`.
  string renamed_from = 30;
}

message RegisterPermissionsRequest {
  // The service that defines the permissions ("dictionary"); every name must start with "<service>:".
  string service = 10;
  repeated PermissionDeclaration permissions = 20;
}

message RegisterPermissionsResponse {
  int32 inserted = 10;
  int32 updated = 20;
  int32 retired = 30;
  int32 deleted = 40;
  int32 renamed = 50;
}

message AssignRoleRequest {
  // Exactly one of the two.
  string user_id = 10;
  string client_id = 20;
  string role = 30;
}

message AssignRoleResponse {}

message RevokeRoleRequest {
  string user_id = 10;
  string client_id = 20;
  string role = 30;
}

message RevokeRoleResponse {}

// ---- clients ----

enum ClientType {
  CLIENT_TYPE_UNSPECIFIED = 0;
  CLIENT_TYPE_PUBLIC = 10;
  CLIENT_TYPE_CONFIDENTIAL = 20;
}

message Client {
  string client_id = 10;
  string name = 20;
  ClientType type = 30;
  repeated string redirect_uris = 40;
  repeated string post_logout_redirect_uris = 50;
  string backchannel_logout_uri = 60;
  repeated string allowed_grants = 70;
  repeated string allowed_scopes = 80;
  // Default audience of the tokens issued to this client.
  string resource = 90;
  repeated string roles = 100;
  // A disabled client can neither start a sign in nor get tokens.
  bool disabled = 110;
}

message CreateClientRequest {
  Client client = 10;
}

message CreateClientResponse {
  Client client = 10;
  // Shown once; empty for a public client.
  string client_secret = 20;
}

message RotateClientSecretRequest {
  string client_id = 10;
}

message RotateClientSecretResponse {
  // Shown once.
  string client_secret = 10;
}

// Replaces everything but client_id and the type (the type is fixed once the client exists).
message UpdateClientRequest {
  string client_id = 10;
  string name = 20;
  repeated string redirect_uris = 30;
  repeated string post_logout_redirect_uris = 40;
  string backchannel_logout_uri = 50;
  repeated string allowed_grants = 60;
  repeated string allowed_scopes = 70;
  string resource = 80;
  repeated string roles = 90;
}

message UpdateClientResponse {
  Client client = 10;
}

message SetClientDisabledRequest {
  string client_id = 10;
  bool disabled = 20;
}

message SetClientDisabledResponse {
  Client client = 10;
}

// Only a disabled client can be deleted (FAILED_PRECONDITION otherwise), and never the client of the
// calling token. Its roles and exchange policies go with it.
message DeleteClientRequest {
  string client_id = 10;
}

message DeleteClientResponse {}

message ListClientsRequest {
  // Clients whose id, name or type contains this text, or that have a grant or a role containing it (case
  // insensitive). Empty lists every client.
  string query = 10;
  // Only clients of this type; unspecified lists both. Combined with query by AND.
  ClientType type = 20;
  // Default 50, at most 200.
  int32 page_size = 30;
  // The next_page_token of the previous page. Clients are ordered by client_id.
  string page_token = 40;
}

message ListClientsResponse {
  repeated Client clients = 10;
  // Empty on the last page.
  string next_page_token = 20;
}

// ---- token exchange ----

message ExchangePolicy {
  string client_id = 10;
  string audience = 20;
  // Space separated scopes the exchanged token may carry at most.
  string max_scope = 30;
  // How many "act" levels the resulting token may have (default 1).
  int32 max_chain_depth = 40;
}

message SetExchangePolicyRequest {
  ExchangePolicy policy = 10;
  // True removes the policy of (client_id, audience).
  bool delete = 20;
}

message SetExchangePolicyResponse {}

message ListExchangePoliciesRequest {
  // Only the policies of this client (exact).
  string client_id = 10;
  // Policies whose client_id, audience or max_scope contains this text (case insensitive).
  string query = 20;
  // Policies whose audience contains this text (case insensitive). All filters are combined with AND.
  string audience = 30;
  // Default 50, at most 200.
  int32 page_size = 40;
  // The next_page_token of the previous page. Policies are ordered by client_id, then audience.
  string page_token = 50;
}

message ListExchangePoliciesResponse {
  repeated ExchangePolicy policies = 10;
  // Empty on the last page.
  string next_page_token = 20;
}

// ---- MFA ----

message GetUserMFARequest {
  string user_id = 10;
}

message GetUserMFAResponse {
  bool enabled = 10;
  bool enforced = 20;
  // The server mode: off, optional or required.
  string mode = 30;
  int32 recovery_codes_left = 40;
  // How many passkeys the user has (ResetUserMFA removes them too).
  int32 passkey_count = 50;
}

message SetUserMFARequest {
  string user_id = 10;
  // False turns MFA off for the user (refused when enforced or mode is required).
  bool enabled = 20;
}

message SetUserMFAResponse {}

message EnforceUserMFARequest {
  string user_id = 10;
  bool enforced = 20;
}

message EnforceUserMFAResponse {}

message ResetUserMFARequest {
  string user_id = 10;
}

message ResetUserMFAResponse {}

// ---- system settings ----

message GetUIStyleRequest {}

message GetUIStyleResponse {
  // saas (the default), glass or mono.
  string ui_style = 10;
  // Palette of each style: {"saas":"aurora","glass":"ocean","mono":"aurora"}.
  map<string, string> ui_palettes = 20;
}

message SetUIStyleRequest {
  string ui_style = 10;
  // Palette per style; a style left out keeps its stored palette.
  map<string, string> ui_palettes = 20;
}

message SetUIStyleResponse {
  string ui_style = 10;
  map<string, string> ui_palettes = 20;
}

message GetRegistrationSettingsRequest {}

message GetRegistrationSettingsResponse {
  // A self-registered user waits for an administrator (default true).
  bool requires_approval = 10;
  // IDENTITY_REGISTRATION_ENABLED of the server; read only. When false nobody can register at all.
  bool registration_enabled = 20;
}

message SetRegistrationSettingsRequest {
  bool requires_approval = 10;
}

message SetRegistrationSettingsResponse {
  bool requires_approval = 10;
  bool registration_enabled = 20;
}
