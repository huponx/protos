version: v2
# The TypeScript package @huponx/protogen: the permission names of every permissions.proto as constants (P) and a
# union type (Permission). The plugin is Go code of this repo (tools/protoc-gen-ts-permissions); scripts/generate.sh
# builds it and puts it on PATH, so nothing has to be installed.
# out: is relative to the protogen repo root (cwd at generate time).
plugins:
  - local: protoc-gen-ts-permissions
    out: ts/src
    strategy: all
    opt: out=permissions.ts
